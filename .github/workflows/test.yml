name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  parser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The tests use only Node's built-in test runner; no install needed.
      - run: npm test
